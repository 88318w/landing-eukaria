<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Contanos de tu proyecto: identidad de marca, estrategia o sistema visual. Te respondemos a la brevedad.">

<link rel="stylesheet" href="tokens.css">
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta name="theme-color" content="#f2efeb">
<link rel="stylesheet" href="style.css">

<script>document.documentElement.classList.add("js")</script>
</head>
<body data-pagina="contact">

<div id="tope" aria-hidden="true"></div>
    <nav class="nav pad" aria-label="Principal" data-i18n-attr="aria-label:nav.label">
      <ul id="menu">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li class="solo-escritorio"><a href="index.html#work" data-i18n="nav.work">Our work</a></li>
        <li class="solo-celular"><a href="proyectos.html" data-i18n="nav.work">Our work</a></li>
        <li><a href="about.html" data-i18n="nav.about">About</a></li>
        <li><a href="contact.html" class="activo" aria-current="page" data-i18n="nav.contact">Contact</a></li>
        <li class="menu-cta"><a class="btn-out" href="contact.html" data-i18n="nav.cta">Pedir presupuesto</a></li>
      </ul>
      <a class="nav-logo" href="index.html"><img src="assets/logo.svg" alt="Eukaria" width="191" height="47"></a>
      <div class="nav-der">
        <button class="lang" type="button" aria-label="Cambiar idioma a inglés"><span data-lang="es">ES</span><span aria-hidden="true">/</span><span data-lang="en">EN</span></button>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"><span></span><span></span><span></span></button>
        <a class="btn-out" href="contact.html" data-i18n="nav.cta">Pedir presupuesto</a>
      </div>
    </nav>

<main class="pagina">
  <section class="section contact">
    <div class="inner pad contact-grid">
      <div>
        <h1 class="contact-titulo reveal"><span data-i18n="contact.titulo">Contanos de tu proyecto</span> <span class="flecha" aria-hidden="true">&#8599;</span></h1>
        <p class="lead reveal" style="--d: 60ms" data-i18n="contact.lead">Contanos qué querés trabajar y te respondemos a la brevedad.</p>
      </div>
      <form id="form" class="reveal" novalidate>
        <div class="field">
          <label for="nombre" data-i18n="form.nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required aria-describedby="nombre-error">
          <p class="error" id="nombre-error" hidden></p>
        </div>
        <div class="field">
          <label for="email" data-i18n="form.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label for="tipo" data-i18n="form.tipo">Qué querés trabajar</label>
          <select id="tipo" name="tipo" required aria-describedby="tipo-error">
            <option value="" data-i18n="form.opcion0">Elegí una opción</option>
            <option data-i18n="form.opcion1">Identidad de marca</option>
            <option data-i18n="form.opcion2">Estrategia</option>
            <option data-i18n="form.opcion3">Sistema visual (papelería, afiches, merchandising)</option>
            <option data-i18n="form.opcion4">Otra cosa</option>
          </select>
          <p class="error" id="tipo-error" hidden></p>
        </div>
        <div class="field">
          <label for="mensaje" data-i18n="form.mensaje">Contanos más</label>
          <textarea id="mensaje" name="mensaje" required minlength="20" aria-describedby="mensaje-help mensaje-error"></textarea>
          <p class="help" id="mensaje-help" data-i18n="form.ayuda">Una idea, el objetivo y, si las hay, las fechas.</p>
          <p class="error" id="mensaje-error" hidden></p>
        </div>
        <button class="btn-solid" type="submit" data-i18n="form.enviar">Enviar consulta</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="pie pie-simple">
  <div class="inner pad pie-grid">
    <div class="pie-datos">
      <img src="assets/logo.svg" alt="Eukaria" width="191" height="47">
      <address>
        <!-- TODO: reemplazar por el mail real del estudio (también en form.js) -->
        <a href="mailto:proyectos@eukaria.com">proyectos@eukaria.com</a>
      </address>
      <p class="copy">&copy; 2026 Eukaria</p>
    </div>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="nav.js" defer></script>
<script src="reveal.js" defer></script>
<script src="form.js" defer></script>
</body>
</html>
